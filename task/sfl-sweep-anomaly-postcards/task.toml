schema_version = "1.3"

artifacts = [
  { source = "/tmp/grading/apps/wandb", service = "wandb" },
  { source = "/tmp/grading/apps/huggingface", service = "huggingface" },
  "/logs/agent/trajectory.json",
]

[task]
name = '''collinear-ai/sfl-sweep-anomaly-postcards'''
description = '''Model-risk reviewers want kill-spend postcards on Hugging Face so release owners can see which training runs burned budget without reopening Weights & Biases. Across Saffron Ledger AI's ten product training projects, rank every run whose st'''
keywords = ["cua", "computer-use", "clone-apps", "wandb", "huggingface", "two-app-chain", "cross", "app", "write", "routing"]
authors = [{ name = "Collinear AI" }]

[metadata]
contract = "harbor-reward"
interface = "cua"
type = "cua"
customer = "anonymized"
harness = "harbor"
scenario = "cua_clone_apps"
cua_template = "cua-clone-apps"
deliveries = ["shareable/evidence"]
apps = ["wandb", "huggingface"]
domain = "mlops"
capability = "cross-app-write-routing"
category = "authored"
difficulty = "hard"
audit = "none"
runs_per_task = 1
source = "anonymized task source"
prebuilt_docker_images = [
    "ghcr.io/collinear-ai/app-clones/wandb:latest",
    "ghcr.io/collinear-ai/app-clones/huggingface:latest",
]
agent_sandbox_image = "ghcr.io/collinear-ai/cua-sky-linux:v0.0.4"
judge = "rewardkit-codex-agent"
judge_model = "gpt-5.5"
judge_reasoning_effort = "high"
criteria_file = "tests/reward_criteria.toml"
judge_prompt = "tests/judge_prompt.md"
recommended_max_steps = 250
seed_world = "saffron_ledger_ai_digital_twin_v1"

[verifier]
environment_mode = "shared"
timeout_sec = 1800

[[verifier.collect]]
service = "wandb"
user = "root"
command = '''mkdir -p /tmp/grading/apps/wandb && python -c 'import sys,urllib.request; req=urllib.request.Request("http://127.0.0.1:8090/state-diffs"); sys.stdout.buffer.write(urllib.request.urlopen(req,timeout=280).read())' > /tmp/grading/apps/wandb/state_diff.json.tmp && mv /tmp/grading/apps/wandb/state_diff.json.tmp /tmp/grading/apps/wandb/state_diff.json'''
timeout_sec = 300

[[verifier.collect]]
service = "huggingface"
user = "root"
command = '''mkdir -p /tmp/grading/apps/huggingface && python -c 'import sys,urllib.request; req=urllib.request.Request("http://127.0.0.1:8090/state-diffs"); sys.stdout.buffer.write(urllib.request.urlopen(req,timeout=280).read())' > /tmp/grading/apps/huggingface/state_diff.json.tmp && mv /tmp/grading/apps/huggingface/state_diff.json.tmp /tmp/grading/apps/huggingface/state_diff.json'''
timeout_sec = 300

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "${REWARDKIT_JUDGE:-codex}"

[agent]
timeout_sec = 12600

[environment]
docker_image = "ghcr.io/collinear-ai/cua-sky-linux:v0.0.4"
network_mode = "public"

[environment.healthcheck]
command = "python3 /opt/harbor/health.py --seed http://seed.clone.test/ready --screenshot --paint-min 0"
interval_sec = 10.0
timeout_sec = 30.0
retries = 150
